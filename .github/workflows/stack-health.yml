name: Stack Health

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Optional override for the deployed app URL
        required: false
        type: string
      api_base_url:
        description: Optional override for the orchestration API base URL
        required: false
        type: string
      auth_token:
        description: Optional override for the upstream smoke auth token
        required: false
        type: string
      require_durable_support_store:
        description: Require a non-default durable support store
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      skip_support_reads:
        description: Skip support read checks against the upstream API
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: stack-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.app_url || secrets.DEPLOY_SMOKE_APP_URL }}
      API_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.api_base_url || secrets.DEPLOY_SMOKE_API_BASE_URL }}
      AUTH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auth_token || secrets.DEPLOY_SMOKE_AUTH_TOKEN }}
      REQUIRE_DURABLE_SUPPORT_STORE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.require_durable_support_store || vars.DEPLOY_SMOKE_REQUIRE_DURABLE_SUPPORT_STORE || 'true' }}
      SKIP_SUPPORT_READS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_support_reads || vars.DEPLOY_SMOKE_SKIP_SUPPORT_READS || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate health-check configuration
        run: |
          test -n "$APP_URL" || { echo "DEPLOY_SMOKE_APP_URL is required"; exit 1; }
          test -n "$API_BASE_URL" || { echo "DEPLOY_SMOKE_API_BASE_URL is required"; exit 1; }
          test -n "$AUTH_TOKEN" || { echo "DEPLOY_SMOKE_AUTH_TOKEN is required"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            generator/package-lock.json

      - name: Install generator dependencies
        working-directory: generator
        run: npm ci

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run scheduled stack health checks
        run: |
          set -o pipefail
          bash scripts/smoke-deployed-stack.sh 2>&1 | tee /tmp/deployed-stack-health.log

      - name: Upload stack health log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-stack-health-log
          path: /tmp/deployed-stack-health.log
          if-no-files-found: warn

      - name: Publish stack health summary
        if: always()
        run: |
          {
            echo "## Stack Health"
            echo
            echo "- APP_URL: \`$APP_URL\`"
            echo "- API_BASE_URL: \`$API_BASE_URL\`"
            echo "- REQUIRE_DURABLE_SUPPORT_STORE: \`$REQUIRE_DURABLE_SUPPORT_STORE\`"
            echo "- SKIP_SUPPORT_READS: \`$SKIP_SUPPORT_READS\`"
            echo
            echo "### Log tail"
            echo '```text'
            tail -n 80 /tmp/deployed-stack-health.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update stack health alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- deployed-stack-health-alert -->';
            const title = 'Deployed stack health failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let logTail = '(log unavailable)';
            try {
              const raw = fs.readFileSync('/tmp/deployed-stack-health.log', 'utf8');
              logTail = raw.slice(-6000);
            } catch {}
            const body = [
              marker,
              'The scheduled deployed stack health check is failing.',
              '',
              `- Run: ${runUrl}`,
              `- APP_URL: \`${process.env.APP_URL ?? '(unset)'}\``,
              `- API_BASE_URL: \`${process.env.API_BASE_URL ?? '(unset)'}\``,
              `- REQUIRE_DURABLE_SUPPORT_STORE: \`${process.env.REQUIRE_DURABLE_SUPPORT_STORE ?? '(unset)'}\``,
              `- SKIP_SUPPORT_READS: \`${process.env.SKIP_SUPPORT_READS ?? '(unset)'}\``,
              '',
              '```text',
              logTail,
              '```',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Failure still reproduces: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close stack health alert issue on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- deployed-stack-health-alert -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.body?.includes(marker));
            if (!existing) {
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Recovered on ${runUrl}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
            });
