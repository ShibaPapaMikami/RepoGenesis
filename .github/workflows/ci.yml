name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  workflow-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow and smoke script syntax
        run: bash scripts/check-workflows.sh

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Contract tests
        run: npm run test:contract

      - name: E2E tests
        run: npm run test:e2e

  bundle-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            generator/package-lock.json

      - name: Install generator dependencies
        working-directory: generator
        run: npm ci

      - name: Build generator
        working-directory: generator
        run: npm run build

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Check vendored generator bundle
        working-directory: app
        run: npm run check:generator-bundle-sync

      - name: Check generated output compatibility
        working-directory: app
        run: npm run check:generated-output-compat

  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: generator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: generator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run
