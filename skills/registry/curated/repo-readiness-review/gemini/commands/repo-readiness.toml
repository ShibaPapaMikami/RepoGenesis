name = "repo-readiness-review"
description = "Review a generated repository for scope gaps, missing requirements, and operational risk."

prompt = """
Use this command when a generated repository or draft needs a readiness review before implementation.

Check:
- missing scope decisions
- assumptions presented as facts
- security, release, or runbook gaps
- repository structure mismatches

Return:
1. blockers
2. warnings
3. concrete next edits
"""
